name = "leavemaxxing-together"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# Not public on its own: the site's Pages Function at /api/together/* reaches it through a
# service binding (see the root wrangler.toml), so it needs no route or workers.dev address.
workers_dev = false

[[durable_objects.bindings]]
name = "GROUP"
class_name = "Group"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Group"]
