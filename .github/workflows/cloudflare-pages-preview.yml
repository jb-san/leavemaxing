name: Deploy Preview to Cloudflare Pages

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    name: Lint and Type Check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check **/*.ts && deno check **/*.tsx

  deploy-preview:
    needs: lint-and-check
    runs-on: ubuntu-latest
    name: Deploy PR Preview
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build static site
        run: deno task export

      - name: Check for Cloudflare secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "secrets_available=false" >> $GITHUB_OUTPUT
            echo "⚠️ Cloudflare secrets not configured - skipping preview deployment"
          else
            echo "secrets_available=true" >> $GITHUB_OUTPUT
          fi

      - name: Verify API token permissions
        if: steps.check-secrets.outputs.secrets_available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Checking token permissions..."
          verify_response=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "Token verification:"
          echo "$verify_response" | jq .

          echo ""
          echo "Testing GET project access..."
          get_response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/leavemaxing" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          http_code=$(echo "$get_response" | grep "HTTP_STATUS:" | cut -d: -f2)
          body=$(echo "$get_response" | sed '/HTTP_STATUS:/d')

          if [ "$http_code" = "200" ]; then
            echo "✅ GET project: OK"
          else
            echo "❌ GET project: HTTP $http_code"
            echo "$body" | jq . || echo "$body"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.check-secrets.outputs.secrets_available == 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          deno run --allow-net --allow-read --allow-env scripts/cloudflare-pages-deploy.ts \
            "${{ github.head_ref }}" \
            "${{ github.sha }}"

      - name: Comment on PR (secrets missing)
        if: steps.check-secrets.outputs.secrets_available == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Preview deployment skipped:** Cloudflare secrets (`CLOUDFLARE_API_TOKEN`, `CLOUDFLARE_ACCOUNT_ID`) are not configured in repository settings.'
            });
