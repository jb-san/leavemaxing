name: Deploy Preview to Cloudflare Pages

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    name: Lint and Type Check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check **/*.ts && deno check **/*.tsx

  deploy-preview:
    needs: lint-and-check
    runs-on: ubuntu-latest
    name: Deploy PR Preview
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build static site
        run: deno task export

      - name: Check for Cloudflare secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "secrets_available=false" >> $GITHUB_OUTPUT
            echo "⚠️ Cloudflare secrets not configured - skipping preview deployment"
          else
            echo "secrets_available=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Wrangler
        if: steps.check-secrets.outputs.secrets_available == 'true'
        run: npm install -g wrangler@3.90.0

      - name: Debug environment variables
        if: steps.check-secrets.outputs.secrets_available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "CLOUDFLARE_API_TOKEN is set: $([[ -n "$CLOUDFLARE_API_TOKEN" ]] && echo "yes" || echo "no")"
          echo "CLOUDFLARE_API_TOKEN length: ${#CLOUDFLARE_API_TOKEN}"
          echo "CLOUDFLARE_ACCOUNT_ID is set: $([[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] && echo "yes" || echo "no")"
          echo "CLOUDFLARE_ACCOUNT_ID length: ${#CLOUDFLARE_ACCOUNT_ID}"

      - name: Deploy to Cloudflare Pages
        if: steps.check-secrets.outputs.secrets_available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Verify env vars are set
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN is empty!"
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ERROR: CLOUDFLARE_ACCOUNT_ID is empty!"
            exit 1
          fi
          
          # Trim whitespace
          export CLOUDFLARE_API_TOKEN="$(echo -n "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(echo -n "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          
          echo "Deploying with token length: ${#CLOUDFLARE_API_TOKEN}"
          wrangler pages deploy dist \
            --project-name=leavemaxing \
            --branch=${{ github.head_ref }} \
            --commit-hash=${{ github.sha }}

      - name: Comment on PR (secrets missing)
        if: steps.check-secrets.outputs.secrets_available == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Preview deployment skipped:** Cloudflare secrets (`CLOUDFLARE_API_TOKEN`, `CLOUDFLARE_ACCOUNT_ID`) are not configured in repository settings.'
            });
