name: Deploy to Cloudflare Pages (Production)

on:
  push:
    branches:
      - main

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    name: Lint and Type Check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check **/*.ts && deno check **/*.tsx

  deploy:
    needs: lint-and-check
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build static site
        run: deno task export

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Sanitize secrets by removing whitespace/newlines/quotes
          export CLOUDFLARE_API_TOKEN=$(echo "$CLOUDFLARE_API_TOKEN_RAW" | tr -d '[:space:]' | tr -d '"' | tr -d "'")
          export CLOUDFLARE_ACCOUNT_ID=$(echo "$CLOUDFLARE_ACCOUNT_ID_RAW" | tr -d '[:space:]' | tr -d '"' | tr -d "'")

          deno run --allow-net --allow-read --allow-env scripts/cloudflare-pages-deploy.ts \
            "main" \
            "${{ github.sha }}"
