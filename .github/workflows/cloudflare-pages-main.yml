name: Deploy to Cloudflare Pages (Production)

on:
  push:
    branches:
      - main

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    name: Lint and Type Check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check **/*.ts && deno check **/*.tsx

  deploy:
    needs: lint-and-check
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build static site
        run: deno task export

      - name: Install Wrangler
        run: npm install -g wrangler@3.90.0

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Verify env vars are set
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN is empty!"
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ERROR: CLOUDFLARE_ACCOUNT_ID is empty!"
            exit 1
          fi
          
          # Trim whitespace
          export CLOUDFLARE_API_TOKEN="$(echo -n "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(echo -n "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          
          echo "Deploying with token length: ${#CLOUDFLARE_API_TOKEN}"
          wrangler pages deploy dist \
            --project-name=leavemaxing \
            --branch=main \
            --commit-hash=${{ github.sha }}
