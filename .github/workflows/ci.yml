name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly rebuild: refreshes holiday data and rolls the year range forward.
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data
      - run: pnpm check
      - run: pnpm test

  build-deploy:
    name: Build and deploy
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      PUBLIC_RYBBIT_SITE_ID: ${{ secrets.RYBBIT_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Smoke test the build
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - name: Check for Cloudflare secrets
        id: secrets
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare secrets are not set, skipping deploy"
          fi
      # Cloudflare refuses a first Worker until the account has a workers.dev subdomain, even
      # though this one is only served on the site's own route. Create it once if it's missing.
      - name: Ensure workers.dev subdomain
        if: steps.secrets.outputs.ok == 'true' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          if curl -fsS -H "$auth" "$api" 2>/dev/null | jq -e '.result.subdomain' > /dev/null; then
            echo "The account already has a workers.dev subdomain."
            exit 0
          fi
          for name in leavemaxxing "leavemaxxing-${GITHUB_REPOSITORY_ID}"; do
            if curl -fsS -X PUT -H "$auth" -H "Content-Type: application/json" \
              --data "{\"subdomain\":\"$name\"}" "$api" > /dev/null; then
              echo "Created a workers.dev subdomain."
              exit 0
            fi
          done
          echo "::error::Couldn't create a workers.dev subdomain. Open Workers & Pages in the Cloudflare dashboard once."
          exit 1
      - name: Deploy Together worker
        if: steps.secrets.outputs.ok == 'true' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config worker/wrangler.toml
      - name: Deploy to Cloudflare Pages
        if: steps.secrets.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          pnpm dlx wrangler@4 pages deploy dist \
            --project-name=leavemaxing \
            --branch="$BRANCH" \
            --commit-hash="${{ github.sha }}"
