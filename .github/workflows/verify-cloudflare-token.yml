name: Verify Cloudflare Token

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Cloudflare API Token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🔍 Token Diagnostics"
          echo "===================="

          # Trim whitespace
          TOKEN=$(echo "$CLOUDFLARE_API_TOKEN" | xargs)
          ACCOUNT=$(echo "$CLOUDFLARE_ACCOUNT_ID" | xargs)

          echo "Token length: ${#TOKEN}"
          echo "Token prefix: ${TOKEN:0:5}..."
          echo "Account ID length: ${#ACCOUNT}"
          echo ""

          echo "Testing Account Token Verification..."
          response=$(curl -s -w "\nHTTP:%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/tokens/verify" \
            -H "Authorization: Bearer $TOKEN")
          http_code=$(echo "$response" | grep "HTTP:" | cut -d: -f2)
          body=$(echo "$response" | sed '/HTTP:/d')

          echo "HTTP Status: $http_code"
          echo "$body" | jq . 2>/dev/null || echo "$body"
          echo ""

          echo "Testing Pages Project Access..."
          response2=$(curl -s -w "\nHTTP:%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects/leavemaxing" \
            -H "Authorization: Bearer $TOKEN")
          http_code2=$(echo "$response2" | grep "HTTP:" | cut -d: -f2)
          body2=$(echo "$response2" | sed '/HTTP:/d')

          echo "HTTP Status: $http_code2"
          echo "$body2" | jq . 2>/dev/null || echo "$body2"

          if [ "$http_code2" = "200" ]; then
            echo ""
            echo "✅ Token is valid and has access to the project!"
            exit 0
          else
            echo ""
            echo "❌ Token authentication failed"
            echo ""
            echo "Expected token format:"
            echo "- Starts with 'cfat_' (account token) or starts with other prefix (user token)"
            echo "- Length: ~53 characters"
            echo "- No quotes, whitespace, or newlines"
            echo ""
            echo "Required permissions:"
            echo "- Cloudflare Pages - Edit"
            echo "- Account scope (not user scope)"
            exit 1
          fi
